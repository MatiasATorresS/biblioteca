  <link rel="stylesheet" href="css/style.css" />
  <style>
    .landing {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      text-align: center;
      padding: 24px;
    }
    .landing__mark {
      width: 64px;
      height: 64px;
      color: var(--accent);
      animation: landing-pop 600ms var(--ease) both;
    }
    .landing__mark svg { width: 100%; height: 100%; }
    .landing h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    .landing p { font-size: 13.5px; color: var(--text-secondary); max-width: 320px; }
    .landing__bar {
      width: 160px;
      height: 4px;
      border-radius: 4px;
      background: var(--border);
      overflow: hidden;
      margin-top: 6px;
    }
    .landing__bar span {
      display: block;
      height: 100%;
      width: 40%;
      background: var(--accent);
      border-radius: 4px;
      animation: landing-bar 1.4s var(--ease) infinite;
    }
    .landing a { font-size: 12.5px; color: var(--accent); font-weight: 600; margin-top: 4px; }
    @keyframes landing-pop {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }
    @keyframes landing-bar {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(280%); }
    }
  </style>
</head>
<body>
  <main class="landing">
    <div class="landing__mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z" />
        <path d="M9 7h6M9 11h6" />
      </svg>
    </div>
    <h1>Biblioteca</h1>
    <p>Sistema de gestión de préstamos, libros y usuarios.</p>
    <div class="landing__bar" aria-hidden="true"><span></span></div>
    <a href="dashboard.html">Entrar al panel ahora</a>
  </main>
</body>
</html>
